name: device-matrix

# Runs the full instrumented suite across Android versions, form factors, orientations and memory sizes.
# Hosted runners have KVM, so these emulators are hardware-accelerated (unlike the cloud dev container).
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: low-end-api24,   api: 24, profile: "Nexus 5",       ram: 1536, orientation: portrait }
          - { name: mid-api30,       api: 30, profile: "pixel_4",       ram: 3072, orientation: portrait }
          - { name: high-api34,      api: 34, profile: "pixel_7_pro",   ram: 6144, orientation: portrait }
          - { name: tablet-api33,    api: 33, profile: "pixel_tablet",  ram: 4096, orientation: landscape }
          - { name: landscape-api30, api: 30, profile: "pixel_4",       ram: 3072, orientation: landscape }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Build APKs
        run: ./gradlew :app:assembleUitest :app:assembleUitestAndroidTest -Pmf.abis=x86_64
      - name: Instrumented suite (${{ matrix.name }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          profile: ${{ matrix.profile }}
          ram-size: ${{ matrix.ram }}M
          disable-animations: true
          script: |
            if [ "${{ matrix.orientation }}" = landscape ]; then adb shell settings put system accelerometer_rotation 0; adb shell settings put system user_rotation 1; fi
            MF_TEST_OUT=build/device-tests/${{ matrix.name }} scripts/android/run-tests.sh --no-build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-tests-${{ matrix.name }}
          path: build/device-tests/

  # Physical devices (hardware GPU/codec variation). Needs a GCP service account with Test Lab access.
  firebase-test-lab:
    runs-on: ubuntu-latest
    needs: emulator
    env:
      HAS_KEY: ${{ secrets.GCP_SA_KEY != '' }}   # secrets can't be used in job-level `if`
    steps:
      - if: env.HAS_KEY != 'true'
        run: echo "GCP_SA_KEY not configured; skipping physical-device run."
      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'
      - uses: actions/setup-java@v4
        if: env.HAS_KEY == 'true'
        with: { distribution: temurin, java-version: 17 }
      - if: env.HAS_KEY == 'true'
        run: ./gradlew :app:assembleUitest :app:assembleUitestAndroidTest -Pmf.abis=arm64-v8a
      - uses: google-github-actions/auth@v2
        if: env.HAS_KEY == 'true'
        with: { credentials_json: "${{ secrets.GCP_SA_KEY }}" }
      - uses: google-github-actions/setup-gcloud@v2
        if: env.HAS_KEY == 'true'
      - if: env.HAS_KEY == 'true'
        run: |
          gcloud firebase test android run --type instrumentation \
            --app app/build/outputs/apk/uitest/app-uitest.apk \
            --test app/build/outputs/apk/androidTest/uitest/app-uitest-androidTest.apk \
            --device model=a10,version=29 --device model=redfin,version=30 --device model=oriole,version=33 \
            --device model=gts7lwifi,version=31,orientation=landscape --timeout 45m
