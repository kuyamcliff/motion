name: build

on:
  push:
  pull_request:

jobs:
  engine-host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache whisper model
        uses: actions/cache@v4
        with:
          path: .cache/models
          key: whisper-ggml-tiny.en-q5_1
      - name: Download offline speech model (tests only)
        run: |
          mkdir -p .cache/models
          test -f .cache/models/ggml-tiny.en-q5_1.bin || curl -fL -o .cache/models/ggml-tiny.en-q5_1.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en-q5_1.bin
      - name: Configure
        run: cmake -S engine -B build-whisper -G Ninja -DCMAKE_BUILD_TYPE=Release -DMF_WITH_WHISPER=ON -DMF_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build-whisper -j
      - name: Unit + integration tests (includes Whisper WER check)
        run: ./build-whisper/mftests
      - name: Scenarios
        run: |
          ./build-whisper/mfcli scenario tests/scenarios/basic_edit.mftest /tmp/mf-scn1
          ./build-whisper/mfcli scenario tests/scenarios/whisper_captions.mftest "$PWD"

  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install NDK + CMake
        run: sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Build debug and release APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease :app:assembleUitestAndroidTest :app:assembleUitest
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: app/build/outputs/apk/**/*.apk

  android-e2e:
    runs-on: ubuntu-latest
    needs: android-apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Instrumented end-to-end tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          script: ./gradlew :app:connectedUitestAndroidTest -Pmf.abis=x86_64
